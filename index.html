function grpDrag(e,i){e.preventDefault();const h=e.currentTarget;h.setPointerCapture(e.pointerId);const rows=[...document.querySelectorAll('#md .gr')],rc=rows.map(r=>r.getBoundingClientRect()),H=rc[i].height,y0=e.clientY;let to=i;const me=rows[i];me.style.transition='none';me.style.position='relative';me.style.zIndex=2;me.style.boxShadow='0 4px 14px rgba(0,0,0,.18)';
h.onpointermove=ev=>{const dy=ev.clientY-y0,c=rc[i].top+H/2+dy;me.style.transform='translateY('+dy+'px)';to=0;rc.forEach((r,k)=>{if(k!=i&&r.top+r.height/2<c)to++});
rows.forEach((r,k)=>{if(k==i)return;let t=0;if(k>i&&k<=to)t=-H;if(k<i&&k>=to)t=H;r.style.transform='translateY('+t+'px)'})};
h.onpointerup=h.onpointercancel=()=>{h.onpointermove=null;if(to!=i){const g=S.groups.splice(i,1)[0];S.groups.splice(to,0,g);save();render()}grpM()}}

async function evDel(id){if(S.events.length<2)return toast('至少要留一個場次');if(!await ask('確認刪除？'))return;S.events=S.events.filter(e=>e.id!=id);S.orders=S.orders.filter(o=>o.ev!=id);S.products.forEach(p=>{if(p.evs)delete p.evs[id]});const gone=S.products.filter(p=>!Object.keys(p.evs||{}).length).map(p=>p.id);S.products=S.products.filter(p=>!gone.includes(p.id));S.products.forEach(p=>{if(p.combo)p.combo=p.combo.filter(c=>!gone.includes(c.pid))});if(S.cur==id)S.cur=S.events[0].id;save();qoev(id);render();toast('已刪除')}

async function impE(f){if(!f)return;if(!await ask('匯入會把檔案中的場次加進目前資料（名稱相同的不會重複），確定要匯入嗎？','匯入'))return;readJ(f,j=>{if(!Array.isArray(j.events))throw 0;let n=0;j.events.forEach(e=>{if(e&&e.name&&!S.events.some(x=>x.name==e.name)){S.events.push({id:Date.now()+n,name:e.name});n++}});save();render();toast('已匯入 '+n+' 個場次')})}
async function impS(f){if(!f)return;if(!await ask('匯入會把檔案中的訂單加進目前資料（已存在的訂單不會重複），確定要匯入嗎？','匯入'))return;readJ(f,j=>{if(!Array.isArray(j.orders))throw 0;const em={};let k=0;(j.events||[]).forEach(e=>{let x=S.events.find(y=>y.name==e.name);if(!x){x={id:Date.now()+(k++),name:e.name};S.events.push(x)}em[e.id]=x.id});
const have=new Set(S.orders.map(o=>o.id));let n=0;j.orders.forEach(o=>{if(!o||have.has(o.id))return;o.ev=em[o.ev]??S.cur;S.orders.push(o);qo(o.id);n++});migOrders();S.orders.sort((a,b)=>b.time-a.time);save();render();toast('已匯入 '+n+' 筆訂單')})}
async function impP(f){if(!f)return;if(!await ask('匯入商品會用檔案內容覆蓋「名稱相同」的商品（價格、圖片、庫存等），確定要匯入嗎？','匯入'))return;readT(f,t=>{let n=0;
if(t[0]=='{'||t[0]=='['){const j=JSON.parse(t),arr=Array.isArray(j)?j:j.products;if(!Array.isArray(arr))throw 0;(j.groups||[]).forEach(g=>{if(!S.groups.includes(g))S.groups.push(g)});(j.works||[]).forEach(g=>{if(!S.works.includes(g))S.works.push(g)});
const idm={},imp=[];arr.forEach(p=>{if(!p||!p.name||p.price==null||isNaN(+p.price))return;const ex=S.products.find(x=>x.name==p.name);let tgt;const stv=p.evs?(S.cur in p.evs?p.evs[S.cur]:(Object.values(p.evs).find(x=>x!=null)??null)):(p.stock??null);
if(ex){const {id,evs,stock,...rest}=p;Object.assign(ex,rest);ex.evs=ex.evs||{};ex.evs[S.cur]=stv;tgt=ex}else{const id=p.id&&!S.products.some(x=>x.id==p.id)?p.id:Date.now()+n;const {evs,stock,...rp}=p;tgt={...rp,id,img:p.img||'',evs:{[S.cur]:stv}};S.products.push(tgt)}
idm[p.id]=tgt.id;imp.push(tgt);if(tgt.group&&!S.groups.includes(tgt.group))S.groups.push(tgt.group);if(tgt.work&&!S.works.includes(tgt.work))S.works.push(tgt.work);n++});
imp.forEach(p=>{if(p.combo)p.combo=p.combo.map(c=>({...c,pid:idm[c.pid]??c.pid}))})}
else{const rows=t.split(/\r?\n/).map(l=>(l.match(/("([^"]|"")*"|[^,]*)(,|$)/g)||[]).map(c=>c.replace(/,$/,'').replace(/^"|"$/g,'').replace(/""/g,'"').trim()));
if(rows.length&&isNaN(+rows[0][1]))rows.shift();rows.forEach(c=>{if(!c[0]||c[1]===''||c[1]==null||isNaN(+c[1]))return;const st=(c[2]===''||c[2]==null)?null:+c[2],ex=S.products.find(p=>p.name==c[0]);if(ex){ex.price=+c[1];ex.evs=ex.evs||{};ex.evs[S.cur]=st}else S.products.push({id:Date.now()+n,name:c[0],price:+c[1],evs:{[S.cur]:st},img:''});n++})}
save();render();toast('已匯入 '+n+' 項商品')})}

const fmtB=n=>n<1024?n+' B':n<1048576?Math.round(n/1024)+' KB':(n/1048576).toFixed(1)+' MB';
async function loadUsage(){const ph=$('#uph'),dt=$('#udt');if(!ph)return;

if(dt)dt.textContent=fmtB(dsz);
let n=0,b=0;
if(sb&&USER){try{let off=0;for(;;){const r=await sb.storage.from('product-images').list(USER.id,{limit:100,offset:off});if(r.error||!r.data||!r.data.length)break;r.data.forEach(f=>{n++;b+=(f.metadata&&f.metadata.size)||0});if(r.data.length<100)break;off+=100}}catch(e){}}
else S.products.forEach(p=>{if(p.img){n++;if(p.img.startsWith('data:'))b+=Math.round(p.img.length*.75)}});
const el=$('#uph');if(el)el.textContent=fmtB(b)+'（'+n+' 張）'}
